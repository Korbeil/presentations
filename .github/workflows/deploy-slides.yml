name: Deploy slides

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: List Slidev presentations
        id: projects
        run: |
          projects=()
          while IFS= read -r slides_md; do
            slides_md="${slides_md#./}"
            talk="${slides_md%\/slides\/slides.md}"
            if [ -f "$talk/slides/package.json" ]; then
              projects+=("$talk")
            fi
          done < <(find . -type f -name slides.md -not -path './node_modules/*')
          if [ "${#projects[@]}" -gt 0 ]; then
            printf 'projects=%s\n' "$(IFS=,; echo "${projects[*]}")" >> "$GITHUB_OUTPUT"
            echo "Detected Slidev projects: ${projects[*]}"
          else
            echo "No Slidev project detected"
          fi

      - name: Build Slidev presentations
        if: steps.projects.outputs.projects != ''
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: |
          IFS=','
          for p in $PROJECTS; do
            echo "Building $p"
            pushd "$p/slides"
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 yarn install --frozen-lockfile
            npx slidev build --out "../../_stage/$p" --base "/presentations/$p/"
            popd
            rm -f "_stage/$p/_redirects"
          done

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '_stage' \
            --exclude '_site' \
            ./ _site/
          # Built Slidev output goes to the root of each presentation folder
          if [ -d _stage ]; then
            cp -a _stage/. _site/
          fi
          while IFS= read -r slides_md; do
            talk="$(dirname "$(dirname "${slides_md#./}")")"
            rm -rf "_site/$talk/slides"
          done < <(find . -type f -name slides.md -not -path './node_modules/*')
          find _site -name '_redirects' -delete
          touch _site/.nojekyll

      - name: Generate index.html and 404 fallback
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: |
          npx --yes marked@15 README.md > _site/readme.body.html
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '<meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Presentations</title>'
            printf '%s\n' '<style>body{max-width:48rem;margin:0 auto;padding:2rem 1.5rem;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#1f2328;line-height:1.6;font-size:16px}h1{font-size:2em;padding-bottom:.3em;border-bottom:1px solid #d0d7de;margin-top:0}h2{font-size:1.5em}ul{padding-left:1.5em}a{color:#0969da;text-decoration:none}a:hover{text-decoration:underline}code{background:#eff2f5;border-radius:6px;padding:.2em .4em;font-size:85%}p,ul{margin:.6em 0}</style>'
            echo '</head><body>'
            cat _site/readme.body.html
            echo '</body></html>'
          } > _site/index.html
          rm _site/readme.body.html
          # SPA deep-link fallback: GitHub Pages only serves a root-level 404.html
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Not found</title><script>'
            for p in ${PROJECTS//,/ }; do
              echo "  if (location.pathname.indexOf('/presentations/$p/') === 0) { location.replace('/presentations/$p/'); }"
            done
            echo '  else { location.replace("/presentations/"); }'
            echo '</script><meta http-equiv="refresh" content="5;url=/presentations/"></head><body>Redirecting…</body></html>'
          } > _site/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
